<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/modernhealth/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Daily workout recommendations from your recovery data.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Adaptive Fitness">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <meta name="theme-color" content="#2E7D5B">

  <title>Adaptive Fitness</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    /*
      Taps that land before Flutter's engine has attached its own pointer
      listeners are silently dropped — no error, no visual feedback, the
      touch just goes nowhere. On a cold app launch that window is real
      (CanvasKit/WASM still loading), and a fast enough tap right after
      opening the app can land inside it. This shield blocks all input
      until Flutter's own `flutter-first-frame` event confirms the engine
      is actually up, instead of letting the bottom nav/buttons appear
      tappable before they safely are.
    */
    #app-loading-shield {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0B0D10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app-loading-shield .spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(46, 125, 91, 0.25);
      border-top-color: #2E7D5B;
      animation: app-loading-spin 0.8s linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }

    /*
      Confirmed (2026-08-21): freezing only happens in standalone
      Home-Screen mode, never in a normal Safari tab on the same device
      with the same app. This is a known WKWebView quirk, not a Flutter
      or CanvasKit bug — standalone mode uses a different underlying
      container than a browser tab, and when a page has no real
      browser-level scrollable content (exactly Flutter's case: one
      fixed-size canvas filling the viewport, with all real scrolling
      handled internally by the Dart widget tree instead of the
      browser), WKWebView's own internal scroll-view/gesture-recognizer
      setup can intermittently fail to hand touches through to the page
      at all. `html`/`body` are given a hair of real scrollable height
      (100.3%) so the browser always considers the page "genuinely
      scrollable," which is the standard, widely-documented mitigation
      for this class of bug. It's imperceptible — Flutter's own canvas
      still fills the exact viewport and handles all visible scrolling
      itself; this just satisfies WKWebView's internal bookkeeping.
    */
    html, body {
      height: 100.3%;
    }
  </style>
</head>
<body>
  <div id="app-loading-shield"><div class="spinner"></div></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var shield = document.getElementById('app-loading-shield');
      if (shield) shield.remove();
    });
    // Nudges WKWebView's internal scroll state on load — the classic,
    // long-documented companion to the CSS fix above for this exact
    // class of standalone-mode touch-delivery bug. Harmless everywhere
    // else (scrolling to (0, 1) on a page that's already effectively
    // non-scrolling is imperceptible).
    window.addEventListener('load', function () {
      window.scrollTo(0, 1);
    });
  </script>
</body>
</html>
